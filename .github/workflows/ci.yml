name: frontend-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
        env:
          # The SPA requires a production API URL at build time; this is a
          # non-secret CI placeholder, not a deployed endpoint.
          VITE_API_URL_PROD: https://ci.invalid/api/v1
          VITE_ENABLE_DEMO_LOGIN: "false"
